name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notebook structure
        run: python -m pip install --disable-pip-version-check nbformat && python -m nbformat --validate unsupervised_confidence_estimation.ipynb
      - name: Compile Python sources if present
        shell: bash
        run: |
          shopt -s nullglob
          files=(**/*.py *.py)
          if ((${#files[@]})); then python -m compileall -q .; fi
