name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" nbformat

      - name: Lint (ruff)
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate notebook structure
        run: python -c "import nbformat; nbformat.validate(nbformat.read('unsupervised_confidence_estimation.ipynb', as_version=4)); print('notebook valid')"
